name: Build Podium iOS Simulator with Cydia Payload

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Extract Source Code Zip & Fix Structure
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q *.zip
          fi
          EXTRACTED_DIR=$(ls -d */ | grep -vE '(.github|Resources|Payload|temp_debs)' | head -n 1)
          if [ -n "$EXTRACTED_DIR" ] && [ -d "$EXTRACTED_DIR" ]; then
            cp -r "${EXTRACTED_DIR}"* .
          fi

      - name: Download & Extract Cydia Rootfs Payload
        run: |
          mkdir -p temp_debs
          mkdir -p Resources/Payload/CydiaRootfs
          cd temp_debs
          
          # Tải các gói lõi Cydia cho iOS 6
          curl -L -O http://apt.saurik.com/debs/cydia_1.1.30_iphoneos-arm.deb
          curl -L -O http://apt.saurik.com/debs/cydia-lproj_1.1.12_iphoneos-arm.deb
          curl -L -O http://apt.saurik.com/debs/dpkg_1.14.25-9_iphoneos-arm.deb
          curl -L -O http://apt.saurik.com/debs/apt7_0.7.25.3-8_iphoneos-arm.deb
          curl -L -O http://apt.saurik.com/debs/uikittools_1.1.12_iphoneos-arm.deb
          curl -L -O http://apt.saurik.com/debs/mobilesubstrate_0.9.6301_iphoneos-arm.deb
          
          # Giải nén các gói .deb
          for deb in *.deb; do
            if [ -f "$deb" ]; then
              ar -x "$deb" || true
              if [ -f "data.tar.gz" ]; then
                tar -xzf data.tar.gz -C ../Resources/Payload/CydiaRootfs || true
                rm -f data.tar.gz
              elif [ -f "data.tar.lzma" ]; then
                tar --lzma -xf data.tar.lzma -C ../Resources/Payload/CydiaRootfs || true
                rm -f data.tar.lzma
              elif [ -f "data.tar.xz" ]; then
                tar -xJf data.tar.xz -C ../Resources/Payload/CydiaRootfs || true
                rm -f data.tar.xz
              fi
              rm -f control.tar.* debian-binary
            fi
          done
          
          mkdir -p ../Resources/Payload/CydiaRootfs/var/mobile/Media
          touch ../Resources/Payload/CydiaRootfs/.cydia_no_stash

      - name: Build Unsigned Archive
        run: |
          PROJECT_FILE=$(ls *.xcodeproj | head -n 1)
          SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          
          echo "Đang build dự án: $PROJECT_FILE với Scheme: $SCHEME_NAME"
          
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Podium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Inject Payload & Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find $RUNNER_TEMP/Podium.xcarchive -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          
          if [ -d "Resources/Payload" ]; then
            cp -r Resources/Payload/* Payload/*.app/
          fi
          
          zip -r Podium-with-Cydia.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Podium-iOS6-Cydia-IPA
          path: Podium-with-Cydia.ipa
