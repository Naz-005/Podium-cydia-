- name: Build Unsigned Archive
        run: |
          PROJECT_FILE=$(ls -d *.xcodeproj | head -n 1)
          
          if [ -z "$PROJECT_FILE" ]; then
            echo "Lỗi: Không tìm thấy file .xcodeproj nào trong thư mục!"
            exit 1
          fi
          
          SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          echo "Đang build dự án: $PROJECT_FILE với Scheme: $SCHEME_NAME"
          
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Podium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES | xcpretty || xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Podium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
